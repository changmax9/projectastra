name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build OCR worker image
        run: docker build --file Dockerfile.worker --tag astra-pdf-worker:ci .

      - name: Smoke test OCR worker image
        run: >-
          docker run --rm --entrypoint sh astra-pdf-worker:ci -c
          "./node_modules/.bin/tsx --version &&
          python3 -c 'import fitz, PIL, pytesseract' &&
          tesseract --version"
